<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPSLS!</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <img
        src="assets/star-trek-title.png"
        alt="Star Trek Title in minecraft text format"
      />
      <img src="assets/rpsls.png" alt="Rock paper scissors lizard spock" />
    </header>
    <img
      src="assets/uss-enterprise.webp"
      alt="Gif of uss-enterprise. Credit: pixilpretzel from es.pixilart.com/pixilpretzel"
    />
    <div>
      Rules:
      <ol>
        <li>Rock crushes Lizard and Scissors</li>
        <li>Paper covers Rock and disproves Spock</li>
        <li>Scissors cuts Paper and kills Lizard</li>
        <li>Lizard poisons Spock and eats Paper</li>
        <li>Spock smashes Scissors and vaporizes Rock</li>
      </ol>
    </div>
    <div>
      <button title="Rock">
        <img src="assets/rock.png" alt="a button containing a plain rock/boulder">
      </button>
      <button title="Paper">
        <img src="assets/paper.png" alt="a button containing a graphic of a sheet of paper">
      </button>
      <button title="Scissors">
        <img src="assets/scissors.png" alt="a button containing a graphic of a sheet of paper">
      </button>
      <button title="Lizard">
        <img src="assets/lizard.png" alt="a button containing a graphic of a gorn used as a lizard">
      </button>
      <button title="Spock!">
        <img src="assets/spock.png" alt="a button containing a picture of Spock with phaser in hand">
      </button>
    </div>
    <div>
      <div>
        <p>Enemy's choice</p>
        <img src="assets/mirror-spock.png" alt="Mirror Spock">
      </div>
      <div>
        <p>Round: 0</p>
        <p>Your lives: 5 | Enemy lives: 5</p>
        <p></p>
      </div>
    </div>
  </body>
</html>
